<title>Woolworths – Dark store floor planner</title>
<style>
/* Shared light layout. Brand tokens set on body.ww / body.nf */
:root{
  --page:#F4F4F0; --card:#FFFFFF; --line:#DDDDD8; --ink:#1A1A1A; --ink-2:#555555;
  --focus:#0B57D0; --radius:8px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
body.ww{ --brand:#178841; --brand-dk:#0F6B32; --brand-text:#0F6B32; --hdr-bg:#FFFFFF; --hdr-ink:#1A1A1A; --hdr-line:#0F6B32; --wm:#178841; }
body.nf{ --brand:#E50914; --brand-dk:#B20710; --brand-text:#B20710; --hdr-bg:#141414; --hdr-ink:#FFFFFF; --hdr-line:#B20710; --wm:#E50914; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);line-height:1.5;font-size:15px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.hdr{background:var(--hdr-bg);border-bottom:4px solid var(--hdr-line)}
.hdr .in{padding:10px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wordmark{font-weight:900;font-size:30px;line-height:1;color:var(--wm);letter-spacing:-.01em}
body.nf .wordmark{font-family:Impact,"Arial Narrow Bold","Bebas Neue",Haettenschweiler,sans-serif;font-weight:400;letter-spacing:.04em;font-size:32px}
.hdr h1{margin:0;font-size:19px;font-weight:700;color:var(--hdr-ink);padding-left:18px;border-left:1px solid #9A9A9A;line-height:1.4}

.hdr .home{margin-left:auto;font-size:15px;font-weight:600;color:var(--brand-text);text-decoration:none;padding:6px 12px;border:1.5px solid currentColor;border-radius:6px}
.hdr .home:hover{background:#EEF4EF}
main{max-width:1320px;margin:0 auto;padding:22px 16px 48px}
.intro{max-width:620px;margin:0 0 16px;color:var(--ink-2);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}

/* Heatmap */
.hm-wrap{margin:0 auto;max-width:1120px}
.hm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:2px;margin:0 auto}
table.hm thead th{height:150px;vertical-align:bottom;padding:0 0 8px;font-size:13px;font-weight:600;color:var(--ink)}
table.hm thead th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
table.hm tbody th{text-align:right;padding:0 10px 0 0;font-size:13px;font-weight:600;white-space:nowrap}
table.hm td{width:56px;min-width:44px;height:50px;text-align:center;font-size:13px;border-radius:3px}
table.hm td:focus-visible{outline:3px solid var(--focus);outline-offset:1px;position:relative;z-index:1}
.legend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin:12px 0 0;flex-wrap:wrap}
.legend .bar{width:260px;max-width:50vw;height:12px;border-radius:6px}
.readout{min-height:1.5em;font-size:14px;margin:8px 0 0;color:var(--ink)}

@media (max-width:600px){
  .hdr h1{border-left:0;padding-left:0;flex-basis:100%;font-size:17px}
  .hdr .home{margin-left:0}
  .wordmark{font-size:24px} body.nf .wordmark{font-size:26px}
  table.hm td{width:36px;min-width:34px;height:36px;font-size:11px}
  table.hm thead th,table.hm tbody th{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

.wrap{max-width:1140px;margin:0 auto}
.top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-bottom:14px}
.top label,.top .lbl{display:block;font-size:17px;font-weight:600;margin-bottom:8px}
.top input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid #5A5A5A;border-radius:6px;background:#fff;color:var(--ink)}
.top input::placeholder{color:#767676}
.top input:focus-visible{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.result{font-size:14px;margin-top:8px;min-height:1.4em;color:var(--ink-2)}
.result b{color:var(--brand-text)}
.score .lbl{font-weight:400;color:var(--ink-2);margin-bottom:2px}
.score .num{font-size:44px;font-weight:700;line-height:1.05;color:var(--brand-text);font-variant-numeric:tabular-nums}
.score .of{font-size:17px;color:var(--ink-2);margin-left:6px}
.score .bar{height:12px;background:#E3E3DE;border-radius:6px;overflow:hidden;margin-top:10px}
.score .bar i{display:block;height:100%;background:var(--brand-dk);transition:width .35s}
.help{color:var(--ink-2);font-size:15.5px;margin:0 0 14px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.aisle{background:#EBEBE6;border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 12px;transition:box-shadow .15s}
.aisle h2{margin:2px 2px 10px;font-size:16px;font-weight:700;color:var(--brand-text)}
.aisle h2 small{font-weight:400;font-size:13px;color:var(--ink-2)}
.slot{display:flex;flex-direction:column;gap:10px}
.cat{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:8px;background:var(--brand-dk);color:#fff;padding:10px 12px;font-weight:700;font-size:16px;
  cursor:grab;touch-action:none;user-select:none}
.cat-head:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.grip{width:10px;height:15px;flex:none;background-image:radial-gradient(#fff 1.4px,transparent 1.5px);background-size:5px 5px}
.prods{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:5px}
.prod{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:14.5px;background:#FAFAF8;transition:background .2s,box-shadow .2s}
.prod.hit{background:#FFF4D6;box-shadow:0 0 0 2px #8A5A00;font-weight:600}
.lane{border:2px dashed #7A7A7A;border-radius:var(--radius);min-height:130px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--ink-2);padding:16px;font-size:15px}
.drop-target{box-shadow:0 0 0 3px var(--focus)}
.lane.drop-target{border-color:var(--focus);color:var(--focus);box-shadow:none;background:#EEF3FD}
.cat.lifted{box-shadow:0 0 0 3px var(--focus)}
.cat.src{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:50;width:240px;box-shadow:0 10px 24px rgba(0,0,0,.2);transform:rotate(-1.5deg)}
body.dragging,body.dragging *{cursor:grabbing !important}
.moveto{padding:2px 8px 10px}
.moveto label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:4px 0 4px}
.moveto select{width:100%;font:inherit;font-size:14.5px;padding:7px 8px;border:1px solid #6E6E6E;border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
.moveto select:focus-visible{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
@media (max-width:760px){.top{grid-template-columns:1fr}}
@media (max-width:560px){.board{grid-template-columns:1fr}}

/* Shared: Pearson matrix + accessible heatmap table */
function pearsonMatrix(cols){
  const k=cols.length, n=cols[0].length;
  const z=cols.map(col=>{ const m=col.reduce((a,b)=>a+b,0)/n; const d=col.map(v=>v-m);
    const s=Math.sqrt(d.reduce((a,b)=>a+b*b,0)); return d.map(v=>v/s); });
  const R=[]; for(let i=0;i<k;i++){ R.push([]); for(let j=0;j<k;j++){
    let s=0; for(let t=0;t<n;t++) s+=z[i][t]*z[j][t]; R[i].push(i===j?1:s); } }
  return R;
}
function fmtR(v){ const s=v.toFixed(2); return s==='-0.00'?'-0.00':s; }

/* Diverging colour: NEG (−1) → white (0) → POS (+1) */
function makeScale(NEG,POS){
  const MID=[255,255,255];
  const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  const colour=r=>{ const t=Math.max(-1,Math.min(1,r)); return t<0?mix(MID,NEG,-t):mix(MID,POS,t); };
  const lum=c=>c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}).reduce((s,v,i)=>s+v*[0.2126,0.7152,0.0722][i],0);
  const text=c=>{ const l=lum(c); return (1.05/(l+0.05)) > ((l+0.05)/0.05) ? '#FFFFFF' : '#1A1A1A'; };
  const rgb=c=>`rgb(${c.join(',')})`;
  return {colour,text,rgb,gradient:`linear-gradient(90deg,${rgb(NEG)},#fff,${rgb(POS)})`};
}

function renderHeatmap(tbl, labels, R, scale, readout, describe){
  const hr=tbl.createTHead().insertRow();
  const c0=document.createElement('td'); c0.setAttribute('aria-hidden','true'); hr.appendChild(c0);
  labels.forEach(l=>{ const th=document.createElement('th'); th.scope='col'; th.innerHTML=`<span>${l}</span>`; hr.appendChild(th); });
  const tb=tbl.createTBody();
  labels.forEach((li,i)=>{
    const tr=tb.insertRow(); const th=document.createElement('th'); th.scope='row'; th.textContent=li; tr.appendChild(th);
    labels.forEach((lj,j)=>{
      const r=R[i][j], c=scale.colour(r), td=tr.insertCell();
      td.style.background=scale.rgb(c); td.style.color=scale.text(c);
      td.textContent=fmtR(r); td.dataset.i=i; td.dataset.j=j; td.tabIndex=(i===0&&j===0)?0:-1;
      const msg=i===j?`${li}: diagonal, always 1.00`:`${li} and ${lj}: r = ${fmtR(r)}`;
      td.title=msg; td.setAttribute('aria-label',msg);
    });
  });
  const say=td=>{ const i=+td.dataset.i,j=+td.dataset.j; readout.textContent = i===j ? `${labels[i]} compared with itself is always 1.00.` : describe(labels[i],labels[j],R[i][j]); };
  tbl.addEventListener('mouseover',e=>{ if(e.target.matches('td[data-i]')) say(e.target); });
  tbl.addEventListener('focusin',e=>{ if(e.target.matches('td[data-i]')) say(e.target); });
  tbl.addEventListener('keydown',e=>{
    const td=e.target; if(!td.matches('td[data-i]')) return;
    const k={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key]; if(!k) return;
    e.preventDefault(); const n=labels.length;
    const i=Math.max(0,Math.min(n-1,+td.dataset.i+k[0])), j=Math.max(0,Math.min(n-1,+td.dataset.j+k[1]));
    const nx=tbl.querySelector(`td[data-i="${i}"][data-j="${j}"]`); td.tabIndex=-1; nx.tabIndex=0; nx.focus();
  });
}
function strengthWord(r){ const a=Math.abs(r); return a>=0.7?'strong':a>=0.4?'moderate':a>=0.2?'weak':'little or no'; }

/* Average-linkage clustering on r: merge while mean r between clusters >= threshold */
function clusterAvg(R, threshold){
  let cl=R.map((_,i)=>[i]);
  const link=(a,b)=>{ let s=0; a.forEach(i=>b.forEach(j=>s+=R[i][j])); return s/(a.length*b.length); };
  while(cl.length>1){
    let best=-Infinity,bi=-1,bj=-1;
    for(let i=0;i<cl.length;i++) for(let j=i+1;j<cl.length;j++){ const v=link(cl[i],cl[j]); if(v>best){best=v;bi=i;bj=j;} }
    if(best<threshold) break;
    cl[bi]=cl[bi].concat(cl[bj]); cl.splice(bj,1);
  }
  return cl;
}


const R = pearsonMatrix(DATA.spend);
const N = DATA.labels.length;

/* Seed aisles: average-linkage clustering, merge while mean r >= 0.4; aisles in business order */
function seedAisles(){
  const cl = clusterAvg(R, 0.4);
  cl.forEach(c=>c.sort((a,b)=>a-b));
  return cl.sort((a,b)=>a[0]-b[0]);
}
/* Togetherness score: each category's mean r with the others in its aisle (0 if alone);
   score = 100 × mean over all categories, clamped to 0–100 */
function togetherness(aisles){
  let t=0;
  aisles.forEach(a=>a.forEach(i=>{ if(a.length<2) return; let s=0; a.forEach(j=>{ if(j!==i) s+=R[i][j]; }); t+=s/(a.length-1); }));
  return Math.max(0,Math.min(100,Math.round(100*t/N)));
}

let aisles = seedAisles();
const board=document.getElementById('board'), live=document.getElementById('live');

function render(focusCat){
  board.innerHTML='';
  aisles.forEach((a,ai)=>{
    const sec=document.createElement('section');
    sec.className='aisle'; sec.dataset.drop=ai;
    sec.setAttribute('aria-label',`Aisle ${ai+1}: ${a.map(i=>DATA.labels[i]).join(', ')}`);
    sec.innerHTML=`<h2>Aisle ${ai+1} <small>· ${a.length} categor${a.length>1?'ies':'y'}</small></h2><div class="slot"></div>`;
    a.forEach(ci=>sec.querySelector('.slot').appendChild(card(ci)));
    board.appendChild(sec);
  });
  const lane=document.createElement('div');
  lane.className='lane'; lane.dataset.drop='new'; lane.textContent='Drop a category here to open a new aisle';
  board.appendChild(lane);
  const sc=togetherness(aisles);
  document.getElementById('scoreNum').textContent=sc;
  document.getElementById('scoreBar').style.width=sc+'%';
  if(focusCat!=null){ const h=board.querySelector(`.cat[data-cat="${focusCat}"] .cat-head`); if(h) h.focus(); }
  runSearch();
}
function card(ci){
  const d=document.createElement('article'); d.className='cat'; d.dataset.cat=ci;
  const ps=DATA.products[ci];
  d.innerHTML=`<div class="cat-head" tabindex="0" role="button" aria-roledescription="draggable category"
      aria-label="${DATA.labels[ci]}, ${ps.length} products. Press Space to move."><span class="grip" aria-hidden="true"></span>${DATA.labels[ci]}</div>
    <ul class="prods">${ps.map(p=>`<li class="prod" data-name="${p.name.toLowerCase().replace(/"/g,'&quot;')}">${p.name}</li>`).join('')}</ul>
    <div class="moveto"><label for="mv${ci}">Move to</label><select id="mv${ci}" data-cat="${ci}">${moveOptions(ci)}</select></div>`;
  return d;
}
/* "Move to" options: current aisle (selected), every other aisle with its categories, and New aisle */
function moveOptions(ci){
  const from=aisleOf(ci);
  let h=aisles.map((a,i)=> i===from
    ? `<option value="${i}" selected>Aisle ${i+1} (current)</option>`
    : `<option value="${i}">Aisle ${i+1}: ${a.map(x=>DATA.labels[x]).join(', ')}</option>`).join('');
  if(aisles[from].length>1) h+='<option value="new">New aisle</option>';
  return h;
}
const aisleOf = ci => aisles.findIndex(a=>a.includes(ci));
function move(ci,target){
  const from=aisleOf(ci);
  if(target!=='new' && +target===from) return false;
  if(target==='new' && aisles[from].length===1) return false;
  aisles[from]=aisles[from].filter(x=>x!==ci);
  if(target==='new') aisles.push([ci]); else aisles[+target].push(ci);
  aisles=aisles.filter(a=>a.length);          // empty aisles disappear
  return true;
}
const announce = ci => live.textContent=`${DATA.labels[ci]} moved to aisle ${aisleOf(ci)+1}. Togetherness score ${togetherness(aisles)}.`;

/* Move-to dropdown on each card */
board.addEventListener('change',e=>{
  const s=e.target.closest('.moveto select'); if(!s) return;
  const ci=+s.dataset.cat;
  if(move(ci,s.value)){
    render(); announce(ci);
    const ns=document.getElementById('mv'+ci); if(ns) ns.focus();
  }
});

/* Pointer drag: mouse, pen, touch */
let drag=null;
board.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.cat-head'); if(!h||e.button>0) return;
  drag={ci:+h.parentElement.dataset.cat, card:h.parentElement, x0:e.clientX, y0:e.clientY, ghost:null, target:null, id:e.pointerId};
  h.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.ghost=drag.card.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost);
    drag.card.classList.add('src'); document.body.classList.add('dragging');
  }
  drag.ghost.style.left=(e.clientX-30)+'px'; drag.ghost.style.top=(e.clientY-18)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY), z=el&&el.closest('[data-drop]');
  setTarget(z?z.dataset.drop:null);
  if(e.clientY<60) scrollBy(0,-12); else if(e.clientY>innerHeight-60) scrollBy(0,12);
});
function endDrag(e,commit){
  if(!drag||e.pointerId!==drag.id) return;
  const {ci,ghost,target}=drag;
  if(ghost){ ghost.remove(); document.body.classList.remove('dragging'); }
  drag.card.classList.remove('src'); setTarget(null); drag=null;
  if(ghost&&commit&&target!=null&&move(ci,target)){ render(); announce(ci); }
}
board.addEventListener('pointerup',e=>endDrag(e,true));
board.addEventListener('pointercancel',e=>endDrag(e,false));
function setTarget(t){
  board.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
  if(drag) drag.target=t;
  if(t!=null){ const n=board.querySelector(`[data-drop="${t}"]`); if(n) n.classList.add('drop-target'); }
}

/* Keyboard move */
let kb=null;
board.addEventListener('keydown',e=>{
  const h=e.target.closest('.cat-head'); if(!h) return;
  const ci=+h.parentElement.dataset.cat, zones=aisles.length+1;
  const name=i=>i===aisles.length?'a new aisle':`aisle ${i+1}`;
  if(!kb&&(e.key===' '||e.key==='Enter')){
    e.preventDefault(); kb={ci,idx:aisleOf(ci)}; h.parentElement.classList.add('lifted'); mark();
    live.textContent=`Picked up ${DATA.labels[ci]}. Use arrow keys to choose an aisle, Space to drop, Escape to cancel.`;
  } else if(kb&&kb.ci===ci){
    if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){
      e.preventDefault(); const d=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
      kb.idx=(kb.idx+d+zones)%zones; mark(); live.textContent=`Over ${name(kb.idx)}.`;
    } else if(e.key===' '||e.key==='Enter'){
      e.preventDefault(); const t=kb.idx===aisles.length?'new':kb.idx; kb=null;
      if(move(ci,t)){ render(ci); announce(ci); } else { render(ci); live.textContent='No change.'; }
    } else if(e.key==='Escape'){
      e.preventDefault(); kb=null; setTarget(null); h.parentElement.classList.remove('lifted'); live.textContent='Move cancelled.';
    }
  }
});
board.addEventListener('focusout',e=>{
  if(kb&&!board.contains(e.relatedTarget)){ kb=null; setTarget(null); board.querySelectorAll('.lifted').forEach(n=>n.classList.remove('lifted')); }
});
function mark(){
  board.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
  const t=kb.idx===aisles.length?'new':kb.idx, n=board.querySelector(`[data-drop="${t}"]`);
  if(n){ n.classList.add('drop-target'); n.scrollIntoView({block:'nearest'}); }
}

/* Product search */
const q=document.getElementById('q'), qr=document.getElementById('qResult');
document.getElementById('prodList').innerHTML=DATA.products.flat().map(p=>p.name).sort().map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
function runSearch(scroll){
  board.querySelectorAll('.prod.hit').forEach(n=>n.classList.remove('hit'));
  const term=q.value.trim().toLowerCase(); if(!term){ qr.textContent=''; return; }
  const hits=[...board.querySelectorAll('.prod')].filter(n=>n.dataset.name.includes(term));
  if(!hits.length){ qr.textContent='No product matches that name.'; return; }
  hits.forEach(n=>n.classList.add('hit'));
  const w=hits.map(n=>{ const ci=+n.closest('.cat').dataset.cat; return {name:n.textContent, aisle:aisleOf(ci)+1, cat:DATA.labels[ci]}; });
  if(w.length===1) qr.innerHTML=`<b>${w[0].name}</b> is in <b>Aisle ${w[0].aisle}</b> (${w[0].cat}).`;
  else { const as=[...new Set(w.map(x=>x.aisle))].sort((a,b)=>a-b); qr.innerHTML=`${w.length} matches in <b>Aisle${as.length>1?'s':''} ${as.join(', ')}</b>.`; }
  if(scroll) hits[0].scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
q.addEventListener('input',()=>runSearch(true));

render();
</script>
